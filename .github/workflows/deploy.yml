name: Build and deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      JEKYLL_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick poppler-utils
          python -m pip install --upgrade pip
          python -m pip install jupyter

      - name: Generate academic CV source
        run: bundle exec ruby scripts/generate_cv.rb --tex-only

      - name: Compile academic CV
        uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: cv_source/academic_cv.tex
          texlive_version: 2026
          work_in_root_file_dir: true

      - name: Install generated academic CV
        shell: bash
        run: |
          set -euo pipefail
          cp cv_source/academic_cv.pdf assets/pdf/academic_cv.pdf
          test -s assets/pdf/academic_cv.pdf
          mkdir -p tmp
          pdfinfo assets/pdf/academic_cv.pdf | tee tmp/academic_cv_pdfinfo.txt
          grep -Eq '^Page size:.*\(A4\)$' tmp/academic_cv_pdfinfo.txt
          pdftotext assets/pdf/academic_cv.pdf tmp/academic_cv.txt
          grep -Fq 'Publications & Preprints' tmp/academic_cv.txt
          grep -Fq 'Talks & Presentations' tmp/academic_cv.txt
          grep -Fq 'Academic Service' tmp/academic_cv.txt
          grep -Fq 'Awards and Scholarships' tmp/academic_cv.txt

      - name: Build production site
        run: bundle exec jekyll build --lsi --trace

      - name: Reject development URLs
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --include='*.html' \
            --include='*.xml' \
            --include='*.txt' \
            'https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(:[0-9]+)?' \
            _site; then
            echo "::error::Generated site contains local development URLs."
            exit 1
          fi

          grep -Fq \
            '<link rel="canonical" href="https://hugol-v.github.io/">' \
            _site/index.html

          grep -Fq \
            'Sitemap: https://hugol-v.github.io/sitemap.xml' \
            _site/robots.txt

          grep -Fq \
            '<loc>https://hugol-v.github.io/' \
            _site/sitemap.xml

          grep -Fq \
            'href="https://hugol-v.github.io/feed.xml"' \
            _site/feed.xml

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy site
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
